name: Finalize Balance v1.5 Cashflow Audit

on:
  push:
    branches: [balance-v1.5-work]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply cashflow consistency fixes
        run: python3 scripts/fix-v15-cashflow-audit.py
      - run: npm ci
      - name: Run all tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Verify standalone bundle
        run: |
          grep -q 'src="\./assets/' dist/index.html
          grep -q 'href="\./assets/' dist/index.html
      - name: Publish final clean preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/v15-preview
          mkdir -p /tmp/v15-preview
          cp -R dist/. /tmp/v15-preview/
          cd /tmp/v15-preview
          git init
          git checkout -b balance-v15-preview-static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "preview: final balance v1.5 cashflow audit"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin balance-v15-preview-static
      - name: Remove one-time audit files
        run: rm -f scripts/fix-v15-cashflow-audit.py .github/workflows/finalize-v15-cashflow.yml
      - name: Commit final audited source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align unique deal cashflow across UI and engine" || exit 0
          git push

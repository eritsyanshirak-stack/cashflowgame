name: Publish Audited Balance v1.5 Preview

on:
  push:
    branches: [balance-v1.5-work]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run all tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Verify standalone paths
        run: |
          grep -q 'src="\./assets/' dist/index.html
          grep -q 'href="\./assets/' dist/index.html
          if grep -q 'src="/assets/' dist/index.html; then exit 1; fi
      - name: Publish clean static preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/v15-preview
          mkdir -p /tmp/v15-preview
          cp -R dist/. /tmp/v15-preview/
          cd /tmp/v15-preview
          git init
          git checkout -b balance-v15-preview-static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "preview: audited balance v1.5 standalone"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin balance-v15-preview-static
      - name: Remove one-time workflow
        run: rm -f .github/workflows/publish-v15-preview.yml
      - name: Commit clean source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-time v1.5 preview workflow" || exit 0
          git push

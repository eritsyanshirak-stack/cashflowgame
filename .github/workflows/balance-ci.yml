name: Balance Patch CI

on:
  push:
    branches:
      - balance-v1.1
  pull_request:
    branches:
      - rewrite/react-mvp

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: balance-preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
      - name: Publish static preview branch
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/balance-preview
          cp -R dist/. /tmp/balance-preview/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan balance-preview-static
          git rm -rf .
          cp -R /tmp/balance-preview/. .
          touch .nojekyll
          git add -A
          git commit -m "preview: balance v1.1 ${GITHUB_SHA}"
          git push --force origin HEAD:balance-preview-static

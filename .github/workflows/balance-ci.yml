name: Balance Patch CI

on:
  push:
    branches:
      - balance-v1.1
  pull_request:
    branches:
      - rewrite/react-mvp

concurrency:
  group: balance-v1.2-materialization
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout balance branch
        uses: actions/checkout@v4
        with:
          ref: balance-v1.1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate balance v1.2 source
        id: balance_patch
        run: |
          if grep -q "export type BusinessIssue" src/game/domain/types.ts; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "Balance v1.2 is already materialized in source."
          else
            python3 scripts/apply_balance_v12_packed.py
            python3 scripts/apply_balance_v12_fixes.py
            echo "applied=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add atomic deal financing
        id: deal_financing
        run: |
          if [ -f scripts/apply_deal_financing.py ]; then
            python3 scripts/apply_deal_financing.py
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit verified source changes
        if: steps.balance_patch.outputs.applied == 'true' || steps.deal_financing.outputs.applied == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_balance_v12_packed.py scripts/apply_balance_v12_fixes.py scripts/apply_deal_financing.py
          git add -A
          git commit -m "feat: add atomic asset sales and collateral inside deals"
          git push origin HEAD:balance-v1.1

      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: balance-preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Publish static preview branch
        run: |
          mkdir -p /tmp/balance-preview
          cp -R dist/. /tmp/balance-preview/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan balance-preview-static
          git rm -rf .
          cp -R /tmp/balance-preview/. .
          sed -i 's|src="/assets/|src="assets/|g; s|href="/assets/|href="assets/|g' index.html
          touch .nojekyll
          git add -A
          git commit -m "preview: balance v1.2 ${GITHUB_SHA}"
          git push --force origin HEAD:balance-preview-static

name: Finalize v1.7 stock audit
on:
  push:
    branches: [balance-v1.7-stock-audit]
    paths:
      - .github/workflows/finalize-v17-stock-audit.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance-v1.7-stock-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply_v17_stock_audit.py
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Save verified build
        run: |
          rm -rf /tmp/cashflow-v17-preview
          mkdir -p /tmp/cashflow-v17-preview
          cp -R dist/. /tmp/cashflow-v17-preview/
      - name: Commit verified source
        run: |
          rm -f scripts/apply_v17_stock_audit.py .github/workflows/finalize-v17-stock-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make stock returns and monthly moves transparent"
          git push origin HEAD:balance-v1.7-stock-audit
      - name: Publish clean audited preview
        run: |
          git checkout --orphan balance-v17-stock-preview-static-new
          git rm -rf . || true
          git clean -fdx
          cp -R /tmp/cashflow-v17-preview/. .
          git add -A
          git commit -m "preview: audited balance v1.7 stock market fixes"
          git branch -M balance-v17-stock-preview-static
          git push --force origin balance-v17-stock-preview-static

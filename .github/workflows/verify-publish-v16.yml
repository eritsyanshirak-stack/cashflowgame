name: Verify and republish Balance v1.6

on:
  push:
    branches: [balance-v1.6-work]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run all tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Verify standalone bundle
        run: |
          grep -q 'src="./assets/' dist/index.html
          grep -q 'href="./assets/' dist/index.html
          test -s dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -type f -name '*.css' -print -quit)"
      - name: Publish clean v1.6 preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/v16-preview
          mkdir -p /tmp/v16-preview
          cp -R dist/. /tmp/v16-preview/
          cd /tmp/v16-preview
          git init
          git checkout -b balance-v16-preview-static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "preview: final audited balance v1.6"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin balance-v16-preview-static
      - name: Remove one-time workflow
        run: rm -f .github/workflows/verify-publish-v16.yml
      - name: Commit clean source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-time v1.6 verification" || exit 0
          git push

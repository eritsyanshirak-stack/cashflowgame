name: Final Balance v1.5 Audit

on:
  push:
    branches: [balance-v1.5-work]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply audit fixes
        run: python3 scripts/fix-v15-audit.py
      - name: Verify audit invariants
        run: |
          grep -q "warrantyUntilMonth" src/game/engine/engine.ts
          grep -q "if (!player.isBot) scheduleDealChain" src/game/engine/engine.ts
          if grep -q "botBuyer" src/game/systems/v14.ts; then
            echo "Fake bot buyer logic is still present"
            exit 1
          fi
          if grep -q "buyerPlayerId:" src/game/systems/v14.ts; then
            echo "Buyer offer still claims an unimplemented bot transfer"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run all tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: Publish clean static preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/v15-preview
          mkdir -p /tmp/v15-preview
          cp -R dist/. /tmp/v15-preview/
          cd /tmp/v15-preview
          git init
          git checkout -b balance-v15-preview-static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "preview: balance v1.5 final audit"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin balance-v15-preview-static
      - name: Remove one-time audit files
        run: rm -f scripts/fix-v15-audit.py .github/workflows/audit-v15.yml
      - name: Commit audited source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close balance v1.5 audit findings" || exit 0
          git push

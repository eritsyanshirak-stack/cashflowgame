name: Materialize audited v1.4

on:
  push:
    branches:
      - balance-v1.4-work

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[v1.4 materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: balance-v1.4-work

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize core source
        run: |
          python3 scripts/materialize_v14.py
          python3 scripts/fix_v14_materialized.py
          python3 scripts/materialize_v14_app.py
          python3 scripts/fix_v14_audit.py
          python3 scripts/materialize_v14_stock_finance.py

      - name: Verify materialized game
        run: |
          npm ci
          npm test
          npm run build

      - name: Remove temporary integration files
        run: |
          rm -f scripts/materialize-v14.mjs
          rm -f scripts/materialize-v14-app.mjs
          rm -f scripts/materialize_v14.py
          rm -f scripts/materialize_v14_app.py
          rm -f scripts/fix_v14_materialized.py
          rm -f scripts/fix_v14_audit.py
          rm -f scripts/materialize_v14_stock_finance.py
          rm -f V14_WORK.md
          rm -f .github/workflows/materialize-v14.yml

      - name: Commit ordinary source code
        run: |
          git config user.name "cashflowgame-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize audited balance v1.4 [v1.4 materialized]"
          git push origin HEAD:balance-v1.4-work

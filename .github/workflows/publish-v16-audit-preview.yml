name: Publish audited v1.6 preview
on:
  push:
    branches: [balance-v1.6-work]
    paths:
      - .github/workflows/publish-v16-audit-preview.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance-v1.6-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Save build
        run: |
          rm -rf /tmp/cashflow-v16-preview
          mkdir -p /tmp/cashflow-v16-preview
          cp -R dist/. /tmp/cashflow-v16-preview/
      - name: Remove one-time workflow from source branch
        run: |
          rm -f .github/workflows/publish-v16-audit-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-time v1.6 preview publisher"
          git push origin HEAD:balance-v1.6-work
      - name: Publish clean static branch
        run: |
          git checkout --orphan balance-v16-preview-static-new
          git rm -rf . || true
          git clean -fdx
          cp -R /tmp/cashflow-v16-preview/. .
          git add -A
          git commit -m "preview: audited balance v1.6 financial clarity fixes"
          git branch -M balance-v16-preview-static
          git push --force origin balance-v16-preview-static

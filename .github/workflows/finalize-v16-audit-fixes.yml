name: Finalize v1.6 audit fixes
on:
  push:
    branches: [balance-v1.6-work]
    paths:
      - scripts/apply_v16_audit_fix.py
      - .github/workflows/finalize-v16-audit-fixes.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance-v1.6-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply_v16_audit_fix.py
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Commit verified source
        run: |
          rm -f scripts/apply_v16_audit_fix.py .github/workflows/finalize-v16-audit-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close v1.6 financial clarity audit gaps"
          git push origin HEAD:balance-v1.6-work

name: Export v1.6 source

on:
  push:
    branches: [balance-v1.6-work]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/cashflow-v16-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: cashflow-v16-source
          path: /tmp/cashflow-v16-source.tar.gz
          retention-days: 1

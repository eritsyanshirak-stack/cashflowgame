name: Materialize Balance v1.5

on:
  push:
    branches: [balance-v1.5-work]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fix one-time source anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-v15.py')
          text = path.read_text()
          text = text.replace('{decision.negotiationNote && <div className=\\"negotiation-note\\">{decision.negotiationNote}</div>}', '{decision.kind === \'business\' && decision.negotiationNote && <div className=\\"negotiation-note\\">{decision.negotiationNote}</div>}')
          path.write_text(text)
          PY
      - name: Apply v1.5 source changes
        run: python3 scripts/apply-v15.py
      - name: Fix generated v1.5 typing anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/game/domain/types.ts')
          text = path.read_text()
          text = text.replace(
            "  expiresMonth: number\n  archetype?: BuyerArchetype\n  buyerPlayerId?: string\n}\n\nexport interface BuyerOffer",
            "  expiresMonth: number\n}\n\nexport interface BuyerOffer",
            1,
          )
          text = text.replace(
            "  final: boolean\n  expiresMonth: number\n}\n\nexport interface MarginCall",
            "  final: boolean\n  expiresMonth: number\n  archetype?: BuyerArchetype\n  buyerPlayerId?: string\n}\n\nexport interface MarginCall",
            1,
          )
          text = text.replace(
            "title: string; description: string; inspection?: DueDiligence;",
            "title: string; description: string; negotiationNote?: string; inspection?: DueDiligence;",
            1,
          )
          path.write_text(text)

          path = Path('src/game/systems/v14.ts')
          text = path.read_text()
          text = text.replace("const buyerNames = ['Частный инвестор', 'Предприниматель', 'Конкурент', 'Инвестиционная группа', 'Управляющая компания']\n\n", '')
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: Remove one-time materializer
        run: rm -f scripts/apply-v15.py .github/workflows/materialize-v15.yml .v15-materialize-trigger
      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize balance v1.5 strategy depth" || exit 0
          git push

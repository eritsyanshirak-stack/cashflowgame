name: Materialize Balance v1.5

on:
  push:
    branches: [balance-v1.5-work]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply v1.5 source changes
        run: python3 scripts/apply-v15.py
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: Remove one-time materializer
        run: rm -f scripts/apply-v15.py .github/workflows/materialize-v15.yml
      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize balance v1.5 strategy depth" || exit 0
          git push
